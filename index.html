var RULES = {
  '0': {cls:'b0', text:'正常，请下单'},
  '1': {cls:'b1', text:'仅专线，禁止下单，会被退'},
  '2': {cls:'b2', text:'特殊安装费，务必提前告知客户，下单务必选择对应初装费，否则会被退'},
  '3': {cls:'b3', text:'薄覆盖，谨慎下单'},
  '4': {cls:'b4', text:'指定渠道，勿下单会被退'},
  '5': {cls:'b5', text:'129+新号新宽5折，以实际办理为准：地址标签【商企五折】'}
};

function norm(s){ return (s||'').toLowerCase().replace(/[【】\[\]（）()\s]/g,''); }

function search(q){
  var qn = norm(q);
  if(!qn) return [];
  var hits = [];
  for(var i=0;i<DATA.length;i++){
    var d = DATA[i], c = d.c;
    if(c === qn) hits.push({d:d, r:0});
    else if(c.indexOf(qn) !== -1) hits.push({d:d, r:1});
    else if(qn.indexOf(c) !== -1 && c.length >= 2) hits.push({d:d, r:2});
  }
  hits.sort(function(a,b){
    if(a.r!==b.r) return a.r-b.r;
    if(a.d.c.length!==b.d.c.length) return a.d.c.length-b.d.c.length;
    return a.d.n < b.d.n ? -1 : 1;
  });
  return hits.slice(0,15).map(function(h){ return h.d; });
}

/* 按核心名分组：同名楼盘的所有记录合并成一张卡片 */
function groupHits(list){
  var map = {}, order = [];
  list.forEach(function(d){
    if(!map[d.c]){ map[d.c] = {c:d.c, items:[]}; order.push(map[d.c]); }
    map[d.c].items.push(d);
  });
  return order;
}

function badge(tag){
  var r = RULES[tag];
  return '<span class="badge ' + (r?r.cls:'bx') + '">' + (r?tag:'?') + '</span>';
}

function renderCard(g){
  var names = {};
  g.items.forEach(function(d){ if(!names[d.n]) names[d.n]=1; });
  var nameList = Object.keys(names).join('、');
  var rows = g.items.map(function(d){
    var r = RULES[d.t];
    return '<div class="res-item">' + badge(d.t) +
           '<span class="txt">' + (r?r.text:'未知') + '<span class="grid">[' + (d.g||'-') + ']</span></span></div>';
  }).join('');
  return '<div class="res-card"><div class="res-name">' + nameList + '</div>' + rows + '</div>';
}

function showModal(q){
  var list = search(q);
  var body = document.getElementById('m-body');
  var html = '';
  if(list.length === 0){
    html = '<div class="not-found">' +
           '<div class="big">暂未查到此楼盘，请登记！</div>' +
           '<div class="small">您查询的是「' + escapeHtml(q) + '」，如确认楼盘名称无误，请先登记反馈</div>' +
           '</div>';
  } else {
    var groups = groupHits(list);
    html = '<div class="hit-count">找到 ' + list.length + ' 条记录，共 ' + groups.length + ' 个楼盘</div>';
    html += groups.map(renderCard).join('');
  }
  body.innerHTML = html;
  document.getElementById('m-q').textContent = '查询：' + q;
  document.getElementById('modal').classList.add('show');
}

function escapeHtml(s){
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function copyResult(q){
  var list = search(q);
  var lines = ['【宽带楼盘查询】 ' + q];
  if(list.length === 0){
    lines.push('暂未查到此楼盘，请登记！');
  } else {
    var groups = groupHits(list);
    groups.forEach(function(g){
      g.items.forEach(function(d){
        var r = RULES[d.t];
        lines.push('• ' + g.c + ' → 标签' + d.t + (r?'：'+r.text:'') + '（' + (d.g||'-') + '）');
      });
    });
  }
  var text = lines.join('\n');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){
      toast('已复制，可直接粘贴到工作群');
    }, function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  var ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制，可直接粘贴到工作群'); }
  catch(e){ toast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

/* 事件绑定 */
var qEl = document.getElementById('q');
var sugEl = document.getElementById('suggest');
var debounceTimer = null;

function doQuery(){ var v = qEl.value.trim(); if(v) showModal(v); }

document.getElementById('btn').addEventListener('click', doQuery);
qEl.addEventListener('keydown', function(e){ if(e.key === 'Enter') doQuery(); });

qEl.addEventListener('input', function(){
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(function(){
    var v = qEl.value.trim();
    if(!v){ sugEl.className='suggest'; return; }
    var list = search(v);
    var html;
    if(list.length === 0){
      html = '<div class="s-empty">暂未查到此楼盘，请登记！</div>';
    } else {
      html = list.slice(0,8).map(function(d){
        var r = RULES[d.t];
        return '<div class="s-item" data-name="'+escapeHtml(d.n)+'">' +
               '<span class="s-name">'+escapeHtml(d.n)+'</span>' +
               '<span class="s-meta">'+badge(d.t)+' '+(d.g||'')+'</span></div>';
      }).join('');
    }
    sugEl.innerHTML = html;
    sugEl.className = 'suggest show';
  }, 150);
});

sugEl.addEventListener('click', function(e){
  var item = e.target.closest ? e.target.closest('.s-item') : null;
  if(item){
    qEl.value = item.getAttribute('data-name');
    sugEl.className = 'suggest';
    showModal(qEl.value);
  }
});

document.addEventListener('click', function(e){
  if(!sugEl.contains(e.target) && e.target !== qEl) sugEl.className='suggest';
});

document.getElementById('m-close').addEventListener('click', function(){
  document.getElementById('modal').classList.remove('show');
});
document.getElementById('modal').addEventListener('click', function(e){
  if(e.target === this) this.classList.remove('show');
});
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') document.getElementById('modal').classList.remove('show'); });

var copyBtn = document.createElement('button');
copyBtn.className = 'copy-btn';
copyBtn.textContent = '📋 复制查询结果（可发工作群）';
copyBtn.addEventListener('click', function(){ copyResult(qEl.value.trim()); });
document.getElementById('m-body').appendChild(copyBtn);
</script>
